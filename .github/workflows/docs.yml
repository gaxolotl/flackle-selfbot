name: API Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeDoc API reference
        run: bun run docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/api
          if-no-files-found: error

      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; API docs were built but not deployed."
          fi

      - name: Ensure Cloudflare Pages project exists
        if: steps.cloudflare.outputs.enabled == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project="flackle-selfbot-docs"
          status=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project")

          if [ "$status" = "404" ]; then
            echo "Creating Cloudflare Pages project: $project"
            create_status=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"flackle-selfbot-docs","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")

            if [ "$create_status" != "200" ] && [ "$create_status" != "201" ] && [ "$create_status" != "409" ]; then
              echo "Cloudflare project creation returned HTTP $create_status"
              cat /tmp/pages-create.json
              exit 1
            fi
          elif [ "$status" != "200" ]; then
            echo "Cloudflare API returned HTTP $status"
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy API docs to Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: pages deploy docs/api --project-name=flackle-selfbot-docs --branch=main
